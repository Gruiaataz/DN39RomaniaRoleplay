services:
  - type: web
    name: dn39-romania-roleplay
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        value: OwnerDn39RomaniaRoleplay
      - key: OWNER_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/dn39.sqlite
      - key: STAFF_APPLICATION_URL
        value: https://discord.gg/ZsZ9QDxuMx
    disk:
      name: dn39-data
      mountPath: /var/data
      sizeGB: 1
